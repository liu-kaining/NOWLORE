substitutions:
  _REGION: asia-east1
  _SERVICE: nowlore
  _REPOSITORY: nowlore
  _PUBLIC_BASE_URL: https://nowlore.thetamind.ai
  _ADMIN_TOKEN_SECRET: nowlore-admin-token
  _CRON_TOKEN_SECRET: nowlore-cron-token

steps:
  - name: node:22
    entrypoint: npm
    args: ["ci"]
  - name: node:22
    entrypoint: npm
    args: ["run", "check"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,PUBLIC_BASE_URL=${_PUBLIC_BASE_URL},CORS_ORIGINS=${_PUBLIC_BASE_URL},STORE_DRIVER=firestore,AI_PROTOCOL=mock,ASSET_DRIVER=local,ASSET_PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}/assets,CHAIN_MODE=dry-run,SIGNER_MODE=disabled,SOLANA_NETWORK=devnet,SOLANA_MAINNET_ENABLED=false
      - --set-secrets=ADMIN_TOKEN=${_ADMIN_TOKEN_SECRET}:latest,CRON_TOKEN=${_CRON_TOKEN_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}
